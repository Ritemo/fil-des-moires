# Télécharge les décors du jeu (peintures du domaine public, Wikimedia Commons) dans art/decor/. Lancement manuel.
name: Décors
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python outils/decors.py
      - name: Enregistrer les décors
        run: |
          git config user.name "Ritemo"
          git config user.email "noreply@anthropic.com"
          git add art/decor
          git diff --cached --quiet || git commit -m "Décors : peintures du domaine public"
          git push
